name: Consultation form security
on:
  pull_request:
    paths:
      - 'script.js'
      - 'tests/consult-form.test.cjs'
      - '.github/workflows/consult-form-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check script.js
      - run: node --test tests/consult-form.test.cjs
